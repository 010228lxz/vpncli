name: CI

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck bin/vpnctl
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: './bin'
          severity: style

  bats:
    name: bats (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: bash -n syntax check
        run: bash -n bin/vpnctl

      - name: Run bats test suite
        run: bats tests/vpnctl.bats tests/integration.bats

  formula-audit:
    name: Homebrew formula audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: brew style
        run: |
          brew tap 010228lxz/vpncli "$GITHUB_WORKSPACE"
          brew style --formula 010228lxz/vpncli/vpncli

      - name: brew audit
        run: brew audit --strict --formula 010228lxz/vpncli/vpncli
